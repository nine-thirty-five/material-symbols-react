name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Cache downloaded SVGs (same key scheme as Publish) so the sample
      # generate rarely hits the CDN.
      - name: Cache icon SVGs
        uses: actions/cache@v4
        with:
          path: .cache
          key: msr-svg-${{ hashFiles('_data/icons.json') }}
          restore-keys: |
            msr-svg-

      # Generate a small sample so the package can be linted without fetching
      # all ~3900 icons, then validate the published exports/types contract.
      - name: Generate sample
        run: npm run generate:sample

      - name: Verify package (publint + attw)
        run: npm run verify:package
